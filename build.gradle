plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.capito'
version = '1.0.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots' }
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url = 'https://repo.codemc.org/repository/maven-public/' }
    maven { url = 'https://jitpack.io' }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.20.1-R0.1-SNAPSHOT'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    compileOnly 'org.bstats:bstats-bukkit:3.2.1'

    compileOnly 'org.xerial:sqlite-jdbc:3.43.0.0'
    compileOnly 'com.mysql:mysql-connector-j:8.1.0'

    implementation 'com.github.cryptomorin:XSeries:9.6.1'
    implementation 'com.zaxxer:HikariCP:4.0.3'
    implementation 'redis.clients:jedis:3.10.0'

    implementation 'com.h2database:h2:1.4.200'
    implementation 'org.postgresql:postgresql:42.2.27'
}

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(8))
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

shadowJar {
    archiveClassifier.set('')

    minimize()

    relocate 'com.cryptomorin.xseries', 'com.capito.libs.xseries'
    relocate 'com.zaxxer.hikari', 'com.capito.libs.hikari'
    relocate 'redis.clients.jedis', 'com.capito.libs.jedis'
    
    exclude "META-INF/*.SF"
    exclude "META-INF/*.DSA"
    exclude "META-INF/*.RSA"
    exclude "META-INF/maven/**"
}

build.dependsOn shadowJar
